# Local services. For now: SQL Server only (Airflow comes in Phase 7).
# Usage: make db-up   /   make db-down
# The password comes from .env (SQLSERVER_PASSWORD). It must be strong (8+ chars, mixed
# upper/lower/digit/symbol) or the container stops right after start. Avoid "$" in it.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: flight-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD:?Set SQLSERVER_PASSWORD in .env}
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  sqlserver_data:
